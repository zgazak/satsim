[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "satsim"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Satellite observation and scene simulator."
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "Alex Cabello", email = "alexander.cabello@algoritics.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "Pillow>=10.0",
    "opensimplex>=0.4.0",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "astropy>=6.0",
    "apng>=0.3.4",
    "scipy>=1.12",
    "torch>=2.2",
    "skyfield>=1.45",
    "sgp4>=2.21",
    "poppy>=1.0.3",
    "pydash>=7.0",
    "pygc>=1.3.0",
    "numba>=0.59",
    "pooch>=1.8.0",
    "czmlpy>=0.9.0",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
]

[project.optional-dependencies]
vision = ["torchvision>=0.17", "kornia>=0.7"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3", "mypy>=1.8"]

[project.scripts]
satsim = "satsim.cli:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "2.0.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/satsim"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA",
    "slow: long-running",
    "integration: full pipeline",
]
addopts = "--strict-markers"
